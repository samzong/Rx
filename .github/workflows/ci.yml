name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: make check

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: agent/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
      - run: make agent-check
      - run: make agent
      - run: target/rx-agent --version

  kimi-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kimi-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: cargo test
      - name: Install pinned native Kimi Code
        shell: pwsh
        run: |
          $env:KIMI_VERSION = '0.39.1'
          $env:KIMI_NO_MODIFY_PATH = '1'
          irm https://code.kimi.com/kimi-code/install.ps1 | iex
          "$env:USERPROFILE\.kimi-code\bin" >> $env:GITHUB_PATH
      - name: Verify native lease lifetime after launcher termination
        run: cargo test native_kimi_lease_survives_launcher_exit -- --ignored --nocapture
