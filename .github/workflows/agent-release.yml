name: Agent release

on:
  push:
    tags: ["rx-agent-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Agent release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: refs/tags/${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Validate agent release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^rx-agent-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\.[1-9][0-9]*))?$ ]]; then
            echo "::error::Invalid SemVer release tag: $RELEASE_TAG"
            exit 1
          fi
          python3 scripts/release-gate.py validate \
            --artifact agent \
            --tag "$RELEASE_TAG" \
            --manifest agent/package.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: agent/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml
      - run: make agent-check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-x64
            os: macos-15-intel
            artifact: rx-agent-darwin-x64
          - target: bun-darwin-arm64
            os: macos-latest
            artifact: rx-agent-darwin-arm64
          - target: bun-linux-x64-baseline
            os: ubuntu-latest
            artifact: rx-agent-linux-x64
          - target: bun-windows-x64-baseline
            os: windows-latest
            artifact: rx-agent-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: agent/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm --dir agent install --frozen-lockfile
      - name: Compile agent
        shell: bash
        env:
          BUN_TARGET: ${{ matrix.target }}
          BINARY: ${{ runner.os == 'Windows' && 'rx-agent.exe' || 'rx-agent' }}
        run: |
          set -euo pipefail
          mkdir -p release-bin
          cd agent
          bun build --compile --target "$BUN_TARGET" src/cli.ts --outfile "../release-bin/$BINARY"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --force --sign - release-bin/rx-agent
            codesign --verify --strict release-bin/rx-agent
          fi
          tar -czf "$ARTIFACT.tar.gz" -C release-bin rx-agent
          mkdir smoke
          tar -xzf "$ARTIFACT.tar.gz" -C smoke
          test "$(smoke/rx-agent --version)" = "$(node -p 'require("./agent/package.json").version')"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          Compress-Archive -Path release-bin/rx-agent.exe -DestinationPath "$env:ARTIFACT.zip"
          Expand-Archive -Path "$env:ARTIFACT.zip" -DestinationPath smoke
          $expected = (Get-Content agent/package.json -Raw | ConvertFrom-Json).version
          $actual = & smoke/rx-agent.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "smoke test failed: '$actual' != '$expected'" }
      - name: Record built commit
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: git rev-parse HEAD > "$ARTIFACT.sha"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: git-cliff@2.14.1
      - uses: actions/download-artifact@v5
        with:
          pattern: rx-agent-*
          path: release-assets
          merge-multiple: true
      - name: Verify release commit
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$VALIDATED_SHA" ]; then
            echo "::error::checked out commit moved after validation"
            exit 1
          fi
          if [ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" != "$VALIDATED_SHA" ]; then
            echo "::error::release tag $RELEASE_TAG moved after validation"
            exit 1
          fi
          for built in release-assets/rx-agent-*.sha; do
            if [ "$(tr -d '[:space:]' < "$built")" != "$VALIDATED_SHA" ]; then
              echo "::error::$built was not built from validated commit $VALIDATED_SHA"
              exit 1
            fi
          done
      - name: Generate scoped release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-gate.py notes \
            --artifact agent \
            --tag "$RELEASE_TAG" \
            --config agent/cliff.toml \
            --output "${RUNNER_TEMP}/release-notes.md"
          test -s "${RUNNER_TEMP}/release-notes.md"
      - name: Publish agent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.check.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          release_flags=(--latest=false)
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          python3 scripts/release-gate.py assert-flags --artifact agent --tag "$tag" -- "${release_flags[@]}"
          cd release-assets
          sha256sum rx-agent-*.tar.gz rx-agent-*.zip > SHA256SUMS
          if gh release view "$tag" >/dev/null 2>&1; then
            edit_flags=("${release_flags[@]}")
            if [ "$IS_PRERELEASE" != "true" ]; then
              edit_flags+=(--prerelease=false)
            fi
            gh release upload "$tag" --clobber rx-agent-*.tar.gz rx-agent-*.zip SHA256SUMS
            gh release edit "$tag" --title "$tag" --notes-file "$notes_file" "${edit_flags[@]}"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes_file" --verify-tag "${release_flags[@]}" rx-agent-*.tar.gz rx-agent-*.zip SHA256SUMS
          fi
          actual_tag="$(gh release view "$tag" --json tagName -q .tagName)"
          actual_prerelease="$(gh release view "$tag" --json isPrerelease -q .isPrerelease)"
          actual_draft="$(gh release view "$tag" --json isDraft -q .isDraft)"
          python3 ../scripts/release-gate.py verify-published \
            --artifact agent \
            --tag "$tag" \
            --actual-tag "$actual_tag" \
            --actual-prerelease "$actual_prerelease" \
            --actual-draft "$actual_draft" \
            --repo-slug "$GITHUB_REPOSITORY"
