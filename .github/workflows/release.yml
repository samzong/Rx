name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: refs/tags/${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -Dwarnings
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python3 scripts/release.py tag --product rx --tag "$RELEASE_TAG")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - run: python3 -B scripts/test-release.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: false
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: make check

  build:
    needs: check
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      upload: true

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: rx-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: rx-*
          path: release-assets
          merge-multiple: true
      - name: Publish Rx release and select latest
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ needs.check.outputs.sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: python3 scripts/release.py publish --product rx --tag "$RELEASE_TAG" --sha "$VALIDATED_SHA" --assets release-assets --repo "$RELEASE_REPO"
