name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: refs/tags/${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -Dwarnings
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\.[1-9][0-9]*))?$ ]]; then
            echo "::error::Invalid SemVer release tag: $RELEASE_TAG"
            exit 1
          fi
          python3 scripts/release-gate.py validate \
            --artifact core \
            --tag "$RELEASE_TAG" \
            --manifest Cargo.toml \
            --github-output "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: false
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: make check

  build:
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      upload: true

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          fetch-tags: true
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.1
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Verify release commit
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$VALIDATED_SHA" ]; then
            echo "::error::release tag moved after validation"
            exit 1
          fi
          for built in rx-*.sha; do
            sha="$(tr -d '[:space:]' < "$built")"
            if [ "$sha" != "$VALIDATED_SHA" ]; then
              echo "::error::$built was built from $sha, not from validated commit $VALIDATED_SHA"
              exit 1
            fi
          done

      - name: Generate scoped release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-gate.py notes \
            --artifact core \
            --tag "$RELEASE_TAG" \
            --config cliff.toml \
            --output "${RUNNER_TEMP}/release-notes.md"
          test -s "${RUNNER_TEMP}/release-notes.md"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.check.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          sha256sum rx-*.tar.gz rx-*.zip > SHA256SUMS
          release_flags=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          python3 scripts/release-gate.py assert-flags --artifact core --tag "$tag" -- "${release_flags[@]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            edit_flags=("${release_flags[@]}")
            if [ "$IS_PRERELEASE" != "true" ]; then
              edit_flags+=(--prerelease=false)
            fi
            gh release upload "$tag" --clobber rx-*.tar.gz rx-*.zip SHA256SUMS
            gh release edit "$tag" --title "$tag" --notes-file "$notes_file" "${edit_flags[@]}"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes_file" --verify-tag "${release_flags[@]}" rx-*.tar.gz rx-*.zip SHA256SUMS
          fi
          actual_tag="$(gh release view "$tag" --json tagName -q .tagName)"
          actual_prerelease="$(gh release view "$tag" --json isPrerelease -q .isPrerelease)"
          actual_draft="$(gh release view "$tag" --json isDraft -q .isDraft)"
          latest_tag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          python3 scripts/release-gate.py verify-published \
            --artifact core \
            --tag "$tag" \
            --actual-tag "$actual_tag" \
            --actual-prerelease "$actual_prerelease" \
            --actual-draft "$actual_draft" \
            --latest-tag "$latest_tag"
