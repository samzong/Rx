[package]
name = "rx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Launch agent harnesses through a configured AI provider"
repository = "https://github.com/samzong/rx"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "6"
fs2 = "0.4"
flate2 = "1"
fuzzy-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
ureq = "3"

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
